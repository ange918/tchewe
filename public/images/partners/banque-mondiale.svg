<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wb-glow" cx="68%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="35%" stop-color="#0072CE"/>
      <stop offset="75%" stop-color="#003B71"/>
      <stop offset="100%" stop-color="#002244"/>
    </radialGradient>
    <clipPath id="globe-clip">
      <circle cx="140" cy="74" r="54"/>
    </clipPath>
  </defs>

  <!-- Globe base circle -->
  <circle cx="140" cy="74" r="54" fill="none" stroke="url(#wb-glow)" stroke-width="7"/>

  <!-- Globe sphere grid -->
  <g clip-path="url(#globe-clip)" stroke="url(#wb-glow)" fill="none">
    <!-- Latitudes -->
    <ellipse cx="140" cy="74" rx="54" ry="24" stroke-width="5"/>
    <ellipse cx="140" cy="50" rx="46" ry="12" stroke-width="4.5"/>
    <ellipse cx="140" cy="98" rx="46" ry="12" stroke-width="4.5"/>
    <line x1="86" y1="74" x2="194" y2="74" stroke-width="5"/>
    
    <!-- Longitudes -->
    <line x1="140" y1="20" x2="140" y2="128" stroke-width="5"/>
    <ellipse cx="140" cy="74" rx="28" ry="54" stroke-width="5"/>
    <ellipse cx="140" cy="74" rx="45" ry="54" stroke-width="4.5"/>
  </g>

  <!-- Highlight flare -->
  <circle cx="172" cy="48" r="9" fill="#00C0F3" opacity="0.85" filter="blur(1px)"/>

  <!-- Text BANQUE MONDIALE -->
  <text x="140" y="165" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#002244" text-anchor="middle" letter-spacing="0.04em">BANQUE MONDIALE</text>
</svg>
